name = "cec-sofia-whatsapp"
main = "src/index.js"
compatibility_date = "2026-07-01"

# No [triggers]/cron — automatic inactivity closing was removed 2026-08-11
# (see the comment on the removed `scheduled()` export in src/index.js).
# Cleanup is manual-only again: the dashboard's "Revisar" / "Confirmar y
# cerrar" buttons call POST /cleanup/scan-and-warn directly.

# Deduplicación de entregas repetidas de webhook (mismo interactionId) — ver
# processInboundMessage(). TTL corto, no es un dato que necesite persistir.
[[kv_namespaces]]
binding = "SOFIA_DEDUP"
id = "94958807d92548389718c4036ea1b178"

# Secrets (set manually, never in this file or in git):
#   wrangler secret put ZENVIA_API_KEY
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put WEBHOOK_SHARED_SECRET   # optional, see README
#   wrangler secret put CLEANUP_TRIGGER_SECRET  # protects POST /cleanup/scan-and-warn
#   wrangler secret put SEND_TRIGGER_SECRET     # protects POST /send/birthday
#   wrangler secret put BIRTHDAY_TEMPLATE_ID    # Zenvia templateId, set once the birthday template is approved
