name = "cec-sofia-whatsapp"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Inactivity closing (archiving) stays manual-only — the dashboard's
# "Revisar" / "Confirmar y cerrar" buttons call POST /cleanup/scan-and-warn
# directly (see the 2026-08-11 note on scanAndWarn in src/index.js for why
# that one specifically is not automatic).
#
# El primer cron es un trabajo distinto y más angosto: cada 20 minutos,
# retryStuckEscalations() reintenta el traspaso en Zenvia de conversaciones que
# Supabase ya tiene marcadas escalated=true y que ningún humano tomó todavía —
# mismo transferToNextAgentInPool() que usa el webhook en vivo, mismas reglas,
# mismo logging. No archiva, no cierra y no le escribe a nadie, así que el
# riesgo del 2026-08-11 (auto-archivar con datos malos) no aplica.
#
# El segundo SÍ le escribe a pacientes. Ver scheduled() en src/index.js para
# las guardas que lo hacen aceptable: son ellas y no la frecuencia.
# */20        -> retryStuckEscalations (no le escribe a nadie).
# 5,20,35,50  -> runFollowupSweep (SÍ le escribe a pacientes).
#
# El horario 9-19 hora CR se aplica DENTRO de la función, no acá: el cron es UTC
# y esa ventana cruza la medianoche UTC. Ver el comentario de scheduled().
#
# Los dos coinciden en el minuto 20. No es un descuido: Cloudflare dispara
# scheduled() una vez POR EXPRESIÓN, cada una con su propio presupuesto de
# subrequests, así que no compiten. (Este comentario decía antes "5,35 ... nunca
# coinciden con los múltiplos de 20", y quedó desactualizado el 2026-09-08 al
# subir el barrido a 4 corridas/hora.)
#
# ⚠ ESTOS DOS TEXTOS ESTÁN DUPLICADOS en src/index.js, como CRON_SEGUIMIENTO y
# CRON_REINTENTOS. Cloudflare entrega el texto literal en event.cron y así es
# como el Worker distingue una tarea de la otra. Si se cambia acá, HAY QUE
# CAMBIARLO ALLÁ — si no, el Worker lo reporta como CRON_DESCONOCIDO en
# `wrangler tail` y el reenganche deja de correr.
[triggers]
crons = ["*/20 * * * *", "5,20,35,50 * * * *"]

# Ya no se usa en el código (2026-08-20): la deduplicación de entregas
# repetidas de webhook se movió a Postgres (tabla sofia_interaction_dedup,
# ver claimInteraction() en src/index.js) porque KV no ofrece
# compare-and-swap y dos entregas concurrentes del mismo interactionId
# podían colarse ambas. Se deja el binding declarado (no hace daño) por si
# se decide borrar el namespace de Cloudflare más adelante.
[[kv_namespaces]]
binding = "SOFIA_DEDUP"
id = "94958807d92548389718c4036ea1b178"

# Secrets (set manually, never in this file or in git):
#   wrangler secret put ZENVIA_API_KEY
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put WEBHOOK_SHARED_SECRET   # optional, see README
#   wrangler secret put CLEANUP_TRIGGER_SECRET  # protects POST /cleanup/scan-and-warn
#   wrangler secret put SEND_TRIGGER_SECRET     # protects POST /send/birthday
#   wrangler secret put BIRTHDAY_TEMPLATE_ID    # Zenvia templateId, set once the birthday template is approved
